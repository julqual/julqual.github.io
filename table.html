<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>
    <table>
        <style>
          table, th, td {
            border: 1px solid black;
          }
        </style>
        <caption>Year Financials (Liquidity in millions)</caption>
        <thead>
            <tr>
                <th>Year</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2010</td>
                <td>+2.8</td>
                <td>+1.5</td>
                <td>-2.1</td>
                <td>+3.4</td>
            </tr>
            <tr>
                <td>2011</td>
                <td>+3.1</td>
                <td>+4.6</td>
                <td>+1.3</td>
                <td>+0.3</td>
            </tr>
            <tr>
                <td>2012</td>
                <td colspan="3">Bankruptcy Court</td>
            </tr>
        </tbody>
    </table>

    <h2>Reasons the company collapsed:</h2>
    <ol type="1">
        <li>The company was bad</li>
        <li>The company made bad decisions</li>
        <li>And now they're broke</li>
    </ol>
</body>
</html>
