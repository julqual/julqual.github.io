<!DOCTYPE html>
<html>
    <head>
        <title>Stylish Schedule</title>
        <style>
            table{
                border-collapse: collapse;
                width: 60%;
                border: 3px solid black;
            }

            th{
                border: 2px solid black;
                padding: 10px;
                color: white;
            }

            td{
                border-style: solid;
                background-color: aliceblue;
                padding: 10px;
            }

            #thead {
                background-color: rgb(90, 174, 248);

            }
            col.column{
                background-color: rgb(136, 241, 248);
            }

        </style>
    </head>
    <body>
        <table>
            <colgroup>
                <col class="column">
            </colgroup>
            
            <tr id="thead">
                <th>Time</th>
                <th>Event</th>
            </tr>
            <tr>
                <td>5:30am</td>
                <td>Wake up</td>
            </tr>
            <tr>
                <td>6:10am</td>
                <td>Leave for school</td>
            </tr>
            <tr>
                <td>7:00am</td>
                <td>Arrive at school</td>
            </tr>
            <tr>
                <td>8:00am</td>
                <td>School starts</td>
            </tr>
            <tr>
                <td>3:00pm</td>
                <td>School ends</td>
            </tr>
            <tr>
                <td>4:00pm</td>
                <td>Arrive at home</td>
            </tr>
            <tr>
                <td>5:30pm</td>
                <td>Eat dinner</td>
            </tr>
            <tr>
                <td>9:30pm</td>
                <td>Go to bed</td>
            </tr>
        </table>
    </body>
</html>
